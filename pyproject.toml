[project]
name = "memory"
version = "0.1.0"
description = "I am trying to create a second brain that listens to my everyday conversation and help me to stay productive."
author = "Abdul Raheem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "openai-whisper>=20250625",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.1",
    "setuptools-rust>=1.13.0",
    "tqdm>=4.70.0",
]
